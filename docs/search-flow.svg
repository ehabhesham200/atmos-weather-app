<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="430" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">What happens when you search for a city</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Step boxes -->
  <rect x="30" y="80" width="160" height="80" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="110" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">1. User types</text>
  <text x="110" y="132" text-anchor="middle" font-size="12" fill="#475569">"London", "10001",</text>
  <text x="110" y="148" text-anchor="middle" font-size="12" fill="#475569">"Eiffel Tower", "51.5,-0.1"</text>

  <rect x="240" y="80" width="160" height="80" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="320" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">2. Validate input</text>
  <text x="320" y="132" text-anchor="middle" font-size="12" fill="#475569">not empty,</text>
  <text x="320" y="148" text-anchor="middle" font-size="12" fill="#475569">max 200 characters</text>

  <rect x="450" y="80" width="160" height="80" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="530" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">3. Find coordinates</text>
  <text x="530" y="126" text-anchor="middle" font-size="12" fill="#475569">Open-Meteo geocoder,</text>
  <text x="530" y="142" text-anchor="middle" font-size="12" fill="#475569">falls back to Nominatim</text>
  <text x="530" y="158" text-anchor="middle" font-size="12" fill="#475569">for landmarks</text>

  <rect x="660" y="80" width="160" height="80" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="740" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#c2410c">4. Fetch weather</text>
  <text x="740" y="132" text-anchor="middle" font-size="12" fill="#475569">Open-Meteo forecast API</text>
  <text x="740" y="148" text-anchor="middle" font-size="12" fill="#475569">(current + 6 days)</text>

  <line x1="190" y1="120" x2="240" y2="120" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="400" y1="120" x2="450" y2="120" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="610" y1="120" x2="660" y2="120" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- Down to response -->
  <line x1="740" y1="160" x2="740" y2="220" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <rect x="240" y="220" width="580" height="80" rx="10" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
  <text x="530" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#7e22ce">5. One clean JSON response back to the browser</text>
  <text x="530" y="270" text-anchor="middle" font-size="12" fill="#475569">resolved location + alternatives ("Did you mean...?") + current conditions + 5-day forecast + units</text>
  <text x="530" y="288" text-anchor="middle" font-size="12" fill="#475569">today is skipped in the forecast list, so the 5 cards are the NEXT 5 days</text>

  <line x1="240" y1="260" x2="110" y2="260" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <rect x="30" y="220" width="160" height="80" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="110" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">6. UI updates</text>
  <text x="110" y="270" text-anchor="middle" font-size="12" fill="#475569">weather card, map flies</text>
  <text x="110" y="286" text-anchor="middle" font-size="12" fill="#475569">to the city, page accent</text>

  <text x="480" y="350" text-anchor="middle" font-size="13" fill="#475569">If anything fails (unknown city, API down, bad input) the backend answers with a clear</text>
  <text x="480" y="370" text-anchor="middle" font-size="13" fill="#475569">error message and the right HTTP status (400 / 404 / 502), shown as a red banner in the UI.</text>
</svg>
