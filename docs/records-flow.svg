<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="DejaVu Sans, sans-serif">
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- row 1: save pipeline -->
  <rect x="30" y="30" width="270" height="92" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="165" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">1. You fill a short form</text>
  <text x="165" y="78" text-anchor="middle" font-size="11" fill="#475569">a place, a start date, an end date,</text>
  <text x="165" y="94" text-anchor="middle" font-size="11" fill="#475569">and an optional note</text>

  <rect x="345" y="30" width="270" height="92" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="480" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">2. The server checks the dates</text>
  <text x="480" y="78" text-anchor="middle" font-size="11" fill="#475569">real calendar dates, start before end,</text>
  <text x="480" y="94" text-anchor="middle" font-size="11" fill="#475569">31 days max, from 1940 to 14 days ahead</text>

  <rect x="660" y="30" width="270" height="92" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="795" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">3. It pins down the place</text>
  <text x="795" y="78" text-anchor="middle" font-size="11" fill="#475569">"london" becomes "London, England,</text>
  <text x="795" y="94" text-anchor="middle" font-size="11" fill="#475569">United Kingdom" with exact coordinates</text>

  <line x1="300" y1="76" x2="345" y2="76" stroke="#475569" stroke-width="2" marker-end="url(#r)"/>
  <line x1="615" y1="76" x2="660" y2="76" stroke="#475569" stroke-width="2" marker-end="url(#r)"/>
  <line x1="795" y1="122" x2="795" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#r)"/>

  <!-- row 2: right to left -->
  <rect x="660" y="170" width="270" height="92" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="795" y="198" text-anchor="middle" font-size="13" font-weight="bold" fill="#c2410c">4. It fetches real temperatures</text>
  <text x="795" y="218" text-anchor="middle" font-size="11" fill="#475569">past days from the history archive,</text>
  <text x="795" y="234" text-anchor="middle" font-size="11" fill="#475569">future days from the forecast, merged</text>

  <rect x="345" y="170" width="270" height="92" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="480" y="198" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">5. Everything is saved</text>
  <text x="480" y="218" text-anchor="middle" font-size="11" fill="#475569">place, dates, note, and a max / min /</text>
  <text x="480" y="234" text-anchor="middle" font-size="11" fill="#475569">average temperature for every day</text>

  <rect x="30" y="170" width="270" height="92" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="165" y="198" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">6. It appears in your list</text>
  <text x="165" y="218" text-anchor="middle" font-size="11" fill="#475569">with an expandable day-by-day</text>
  <text x="165" y="234" text-anchor="middle" font-size="11" fill="#475569">temperature table</text>

  <line x1="660" y1="216" x2="615" y2="216" stroke="#475569" stroke-width="2" marker-end="url(#r)"/>
  <line x1="345" y1="216" x2="300" y2="216" stroke="#475569" stroke-width="2" marker-end="url(#r)"/>

  <!-- action strip -->
  <text x="480" y="312" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Once saved, every record can be...</text>

  <rect x="30" y="332" width="210" height="100" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="135" y="362" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">Viewed</text>
  <text x="135" y="384" text-anchor="middle" font-size="11" fill="#475569">open any record and see</text>
  <text x="135" y="400" text-anchor="middle" font-size="11" fill="#475569">each day's temperatures</text>

  <rect x="260" y="332" width="210" height="100" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="365" y="362" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">Edited</text>
  <text x="365" y="384" text-anchor="middle" font-size="11" fill="#475569">change place, dates or note;</text>
  <text x="365" y="400" text-anchor="middle" font-size="11" fill="#475569">the server re-checks and</text>
  <text x="365" y="416" text-anchor="middle" font-size="11" fill="#475569">re-fetches fresh temperatures</text>

  <rect x="490" y="332" width="210" height="100" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="595" y="362" text-anchor="middle" font-size="13" font-weight="bold" fill="#b91c1c">Deleted</text>
  <text x="595" y="384" text-anchor="middle" font-size="11" fill="#475569">one click and the record</text>
  <text x="595" y="400" text-anchor="middle" font-size="11" fill="#475569">is removed for good</text>

  <rect x="720" y="332" width="210" height="100" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="825" y="362" text-anchor="middle" font-size="13" font-weight="bold" fill="#c2410c">Exported</text>
  <text x="825" y="384" text-anchor="middle" font-size="11" fill="#475569">download the whole list as a</text>
  <text x="825" y="400" text-anchor="middle" font-size="11" fill="#475569">file: JSON, CSV (spreadsheet),</text>
  <text x="825" y="416" text-anchor="middle" font-size="11" fill="#475569">XML, or Markdown</text>

  <rect x="30" y="456" width="900" height="48" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="476" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#334155">This is the database part of the assessment: Create, Read, Update, Delete (known as "CRUD")</text>
  <text x="480" y="494" text-anchor="middle" font-size="11" fill="#64748b">a bad form entry never breaks anything, the server replies with a clear message explaining what to fix</text>
</svg>
